<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームチャット</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <header>
        <h1>ゲームチャット</h1>
    </header>

    <main class="chat-area">

        <div class="message other">
            <div class="bubble">最近どんなゲームをしてる？</div>
        </div>

        <div class="message me">
            <div class="bubble">最近はマインクラフトをしてるよ。</div>
        </div>

        <div class="message other">
            <div class="bubble">建築とかしてるの？</div>
        </div>

        <div class="message me">
            <div class="bubble">うん。家を作ったり探検したりしてるよ。</div>
        </div>

        <div class="message other">
            <div class="bubble">楽しそうだね！</div>
        </div>

        <div class="message me">
            <div class="bubble">特に友達と一緒に遊ぶと時間を忘れるくらい楽しいし、いろいろなアイデアで建築できるところが好きなんだ。</div>
        </div>

    </main>

    <div class="input-area">
        <input type="text" placeholder="メッセージを入力">
        <button>送信</button>
    </div>

</body>
</html>
